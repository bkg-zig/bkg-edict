[package]
name = "edict-web"
version = "2.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"
description = "Weboberflaeche von Edict 2.0 auf Basis von Dioxus"

# Eigener Workspace. Die Oberflaeche baut fuer wasm32-unknown-unknown und
# bleibt deshalb ausserhalb des Haupt-Workspace.
[workspace]

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", features = ["sink"] }
gloo-net = { version = "0.6.0", default-features = false, features = [
    "http",
    "json",
    "websocket",
] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Location", "Window"] }

[dev-dependencies]
edict-core = { path = "../../crates/edict-core" }
